<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <title>PACE RUN — sem conexão</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 80% at 80% 10%, rgba(198, 255, 61, 0.12), transparent 60%),
          radial-gradient(90% 70% at 0% 100%, rgba(255, 90, 31, 0.14), transparent 60%), #111318;
        color: #f4f6f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card { max-width: 420px; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 20px;
        background: linear-gradient(180deg, #181c25, #090b0f);
      }
      h1 { font-size: 22px; letter-spacing: 0.04em; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #a9b0bd; line-height: 1.5; font-size: 15px; }
      button {
        width: 100%; padding: 16px; border: 0; border-radius: 12px;
        background: #c6ff3d; color: #12180a; font-weight: 700; font-size: 16px;
        letter-spacing: 0.06em; cursor: pointer;
      }
      small { display: block; margin-top: 18px; color: #6f7787; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="44" height="44" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M144 384a116 116 0 1 1 224 0" fill="none" stroke="#c6ff3d" stroke-width="44" stroke-linecap="round" />
          <path d="M256 297 334 219" fill="none" stroke="#f4f6f0" stroke-width="32" stroke-linecap="round" />
          <circle cx="256" cy="297" r="26" fill="#ff5a1f" />
        </svg>
      </div>
      <h1>SEM CONEXÃO</h1>
      <p>
        O PACE RUN precisa de internet para abrir esta página pela primeira vez. Suas gravações já
        salvas no aparelho continuam disponíveis.
      </p>
      <button type="button" onclick="location.reload()">TENTAR NOVAMENTE</button>
      <small>PACE RUN</small>
    </div>
  </body>
</html>
